name: Stale-WIP sweep caller

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report recovery candidates without commenting or changing labels
        required: false
        default: false
        type: boolean

jobs:
  sweep:
    uses: ./.forgejo/workflows/reusable/stale-wip.yml
    with:
      forgejo_hostname: forge.mrs.uppidi.com
      repo: xpufx-org/agent-mux
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      issues: write
