# npm publish caller for the agent-mux plugin.
#
# Stage-only release path: the platform reusable workflow validates inputs,
# syncs package.json to the git tag, runs `npm pack`, writes a manifest, and
# uploads the tarball artifact. It never publishes to npm. The operator
# downloads the artifact and runs `npm publish <tarball> --tag latest`.
# No NPM_TOKEN is used or required.
name: Plugin submit caller

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      npm_tag:
        description: 'npm dist-tag recorded in the staged manifest'
        required: false
        default: 'latest'
        type: string

jobs:
  submit:
    uses: xpufx-org/platform/.forgejo/workflows/reusable/plugin-submit.yml@main
    with:
      plugin_path: .
      npm_tag: ${{ inputs.npm_tag || 'latest' }}
      publish: false
      mirror: false
      mirror_repo: ""
    permissions:
      contents: read
